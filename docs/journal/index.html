<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DOLZORE JOURNAL | 町の掲示板</title>
  <meta name="description" content="DOLZOREの町の掲示板。音楽、制作、道具、試して分かったことを記事として公開します。">
  <meta name="robots" content="index,follow">
  <link rel="stylesheet" href="../styles.css">
  <script src="../site.js" defer></script>
</head>
<body class="world-body journal-v3">
<header class="world-header">
  <a class="world-brand" href="../"><span class="brand-mark">DOLZORE</span><small>ドルゾーレ</small></a>
  <nav class="world-nav"><a href="../">WORLD</a><a href="../music/">MUSIC</a><a class="active" href="./">JOURNAL</a><a href="../about/">ABOUT</a><a href="../support/">SUPPORT</a><a href="../legal/">LEGAL</a></nav>
</header>

<main class="journal-page journal-board-page">
  <section class="journal-board-hero">
    <div class="board-sign">
      <span class="board-pin pin-a" aria-hidden="true"></span>
      <span class="board-pin pin-b" aria-hidden="true"></span>
      <p class="pixel-kicker">TOWN NOTICE BOARD</p>
      <h1>町の掲示板です。</h1>
      <p>音楽のこと。つくること。道具のこと。<br>試して分かったことを、記事になった順に貼っていきます。</p>
      <small>まだ何も貼っていない日もあります。そういう日もあります。</small>
    </div>
    <div class="board-side-art" aria-hidden="true">
      <div class="pixel-lamp"></div>
      <div class="pixel-bench"></div>
      <div class="pixel-bird"></div>
    </div>
  </section>

  <section class="journal-board">
    <div class="journal-board-title">
      <span>NEW POSTS</span>
      <strong>新しい掲示</strong>
    </div>
    <div class="journal-list" data-journal-list>
      <div class="journal-empty note-paper">
        <span class="paper-pin" aria-hidden="true"></span>
        <strong>まだ新しい掲示はありません。</strong>
        <p>店主が書いているところです。少しだけ待ってください。</p>
      </div>
    </div>
  </section>
</main>

<footer class="world-footer">
  <div><strong>DOLZORE JOURNAL</strong><p>読んだあと、少し役に立てば十分です。</p></div>
  <div class="footer-links"><a href="../">World</a><a href="../music/">Music</a><a href="../support/">Support</a><a href="../legal/">Legal</a></div>
</footer>
</body>
</html>

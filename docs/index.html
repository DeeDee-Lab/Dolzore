<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DOLZORE | 歩ける小さな町</title>
  <meta name="description" content="DOLZOREの小さな町を歩いて、Creator BGMと読みものを見つけられます。">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="https://deedee-lab.github.io/Dolzore/">
  <link rel="stylesheet" href="styles.css">
  <script src="town-game.js" defer></script>
</head>
<body class="world-body world-v5">
<header class="world-header">
  <a class="world-brand" href="./" aria-label="DOLZORE ホーム">
    <span class="brand-mark">DOLZORE</span><small>ドルゾーレ</small>
  </a>
  <nav class="world-nav" aria-label="メインナビゲーション">
    <a class="active" href="./">WORLD</a>
    <a href="music/">MUSIC</a>
    <a href="journal/">JOURNAL</a>
    <a href="support/">SUPPORT</a>
    <a href="legal/">LEGAL</a>
  </nav>
</header>

<main>
  <section class="walkable-world" data-town-world aria-labelledby="town-title">
    <div class="world-titlebar">
      <div>
        <p class="pixel-kicker">DOLZORE TOWN / AREA 01</p>
        <h1 id="town-title">町を歩いてみる。</h1>
      </div>
      <p class="world-control-hint"><strong>MOVE</strong> 矢印 / WASD　<strong>JUMP</strong> Space　<strong>TALK / ENTER</strong> Enter</p>
    </div>

    <div class="game-viewport" data-game-viewport>
      <canvas class="town-canvas" data-town-canvas width="480" height="270" tabindex="0" aria-label="歩けるDOLZOREの町"></canvas>

      <a class="game-building-label cafe" href="#" data-place-label="cafe" aria-label="CAFE">CAFE</a>
      <a class="game-building-label journal" href="journal/" data-place-label="journal">JOURNAL</a>
      <a class="game-building-label music" href="music/" data-place-label="music">MUSIC</a>

      <div class="game-dialogue-panel" data-town-dialogue aria-live="polite">
        <strong data-dialogue-name>DOLZORE</strong>
        <p data-dialogue-text>ソラを動かして、町を歩けます。</p>
      </div>
    </div>

    <div class="game-control-row">
      <div class="dpad" aria-label="移動ボタン">
        <button type="button" class="dpad-up" data-move="up" aria-label="上へ">▲</button>
        <button type="button" class="dpad-left" data-move="left" aria-label="左へ">◀</button>
        <button type="button" class="dpad-down" data-move="down" aria-label="下へ">▼</button>
        <button type="button" class="dpad-right" data-move="right" aria-label="右へ">▶</button>
      </div>
      <div class="action-cluster">
        <button type="button" class="action-button" data-action>話す / 入る</button>
        <button type="button" class="jump-button" data-jump>JUMP</button>
        <button type="button" class="bgm-button" data-bgm-toggle aria-pressed="true">♪ BGM ON</button>
      </div>
      <div class="resident-list" aria-label="町の住人">
        <span><b class="resident-dot sora"></b>SORA</span>
        <span><b class="resident-dot melo"></b>MELO</span>
        <span><b class="resident-dot yuzu"></b>YUZU</span>
        <span><b class="resident-dot pon"></b>PON</span>
      </div>
    </div>
  </section>

  <section class="world-fallback-links" aria-label="直接開く">
    <a href="music/"><span>MUSIC</span><strong>Creator BGM 60曲</strong><small>試聴・購入はこちら</small></a>
    <a href="journal/"><span>JOURNAL</span><strong>町の掲示板</strong><small>記事を読む</small></a>
  </section>
</main>

<footer class="world-footer">
  <div><strong>DOLZORE</strong><p>Music / Journal</p></div>
  <div class="footer-links"><a href="music/">Music</a><a href="journal/">Journal</a><a href="support/">Support</a><a href="legal/">Legal</a></div>
</footer>
</body>
</html>

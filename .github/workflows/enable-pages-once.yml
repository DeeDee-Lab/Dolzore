name: Enable DOLZORE GitHub Pages once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-pages-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable-pages:
    runs-on: [dolzore-site-osk222]
    timeout-minutes: 10
    steps:
      - name: Enforce DOLZORE site runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (([string]$env:COMPUTERNAME).ToUpperInvariant() -ne 'OSK222') {
            throw "DOLZORE_WRONG_HOST:$env:COMPUTERNAME"
          }
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
      - name: Confirm existing GitHub CLI authentication
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          gh --version
          $login = gh api user --jq .login
          if ($LASTEXITCODE -ne 0 -or -not $login) {
            throw "NO_PERSISTENT_GH_ADMIN_AUTH"
          }
          Write-Host "GH_LOGIN=$login"
      - name: Enable Pages for GitHub Actions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          gh api repos/DeeDee-Lab/Dolzore/pages --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "PAGES_SITE_ALREADY_EXISTS"
            exit 0
          }
          gh api --method POST repos/DeeDee-Lab/Dolzore/pages -f build_type=workflow
          if ($LASTEXITCODE -ne 0) {
            throw "PAGES_ENABLE_FAILED:$LASTEXITCODE"
          }
          Write-Host "PAGES_SITE_CREATED"

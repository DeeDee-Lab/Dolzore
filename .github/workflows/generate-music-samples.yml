name: Generate DOLZORE music samples

on:
  workflow_dispatch:
  push:
    branches:
      - music-only-site-20260928
    paths:
      - "scripts/generate_music_samples.py"
      - "docs/data/tracks.json"
      - ".github/workflows/generate-music-samples.yml"

permissions:
  contents: write

jobs:
  samples:
    runs-on: [dolzore-site-osk222]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: music-only-site-20260928
      - name: Prepare Python audio helper
        run: python -m pip install --user imageio-ffmpeg
      - name: Generate bounded 20-second samples only
        run: python scripts/generate_music_samples.py
      - name: Verify public audio boundary
        run: python -c "from pathlib import Path; p=list(Path('docs/audio/samples').glob('bgm-*.mp3')); assert len(p)==60, len(p); assert not any('downloads/bgm' in x.read_text(encoding='utf-8',errors='ignore') for x in Path('docs').rglob('*') if x.is_file() and x.suffix.lower() in {'.html','.js','.css','.json','.xml','.txt'})"
      - name: Commit sample-only assets
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audio/samples
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "assets: generate 20-second jukebox samples [skip ci]"
            git push origin HEAD:music-only-site-20260928
          } else {
            Write-Host "No sample changes."
          }

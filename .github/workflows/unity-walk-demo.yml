name: Unity Walk Demo

on:
  push:
    branches:
      - feature/unity-walkable-chibi
    paths:
      - game/unity/walkdemo/**
      - .github/workflows/unity-walk-demo.yml
  workflow_dispatch:

jobs:
  build:
    runs-on:
      - dolzore-site-osk222
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Resolve Unity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"

          if (([string]$env:COMPUTERNAME).ToUpperInvariant() -ne 'OSK222') {
            throw "DOLZORE_WRONG_HOST:$env:COMPUTERNAME"
          }

          $unity = "C:\Program Files\Unity\Hub\Editor\6000.5.1f1\Editor\Unity.exe"
          if (-not (Test-Path $unity)) {
            throw "DOLZORE_UNITY_6000_5_1_NOT_FOUND"
          }

          $webgl = Join-Path (Split-Path $unity -Parent) "Data\PlaybackEngines\WebGLSupport"
          if (-not (Test-Path $webgl)) {
            throw "DOLZORE_WEBGL_MODULE_NOT_FOUND"
          }

          "UNITY_EXE=$unity" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create Walk Demo Project
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\WalkDemoProject"
          $template = Join-Path $env:RUNNER_TEMP "DolzoreWalkDemoTemplate"
          $createLog = Join-Path $env:RUNNER_TEMP "dolzore-walk-create.log"

          if (Test-Path $project) { Remove-Item $project -Recurse -Force }
          if (Test-Path $template) { Remove-Item $template -Recurse -Force }

          $args = @("-quit","-batchmode","-createProject",$template,"-logFile",$createLog)
          $proc = Start-Process -FilePath "$env:UNITY_EXE" -ArgumentList $args -Wait -PassThru

          if (Test-Path $createLog) { Get-Content $createLog -Tail 200 }
          if ($proc.ExitCode -ne 0) {
            throw "DOLZORE_WALK_CREATE_FAILED:$($proc.ExitCode)"
          }

          New-Item -ItemType Directory -Path $project -Force | Out-Null
          Copy-Item -Path (Join-Path $template "ProjectSettings") -Destination $project -Recurse -Force
          Copy-Item -Path (Join-Path $template "Packages") -Destination $project -Recurse -Force
          Copy-Item -Path (Join-Path $template "Assets") -Destination $project -Recurse -Force

          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "game\unity\bootstrap\Packages\manifest.json") -Destination (Join-Path $project "Packages\manifest.json") -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "game\unity\walkdemo\Assets\*") -Destination (Join-Path $project "Assets") -Recurse -Force

          "WALK_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Unity WebGL
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP "dolzore-walk-build.log"
          $args = @(
            "-quit",
            "-batchmode",
            "-projectPath",$env:WALK_PROJECT,
            "-buildTarget","WebGL",
            "-executeMethod","Dolzore.Editor.WalkDemoBuilder.BuildAndExport",
            "-logFile",$log
          )

          $proc = Start-Process -FilePath "$env:UNITY_EXE" -ArgumentList $args -Wait -PassThru
          $code = $proc.ExitCode

          if (Test-Path $log) { Get-Content $log -Tail 700 }
          Write-Host "DOLZORE_WALK_UNITY_EXIT=$code"

          if ($code -ne 0) {
            exit $code
          }

      - name: Verify Build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            "Assets\Scenes\WalkDemo.unity",
            "BuildArtifacts\walk-demo.png",
            "BuildArtifacts\walk-demo-receipt.json",
            "Builds\WalkDemo\index.html"
          )

          foreach ($rel in $required) {
            $path = Join-Path $env:WALK_PROJECT $rel
            if (-not (Test-Path $path)) {
              throw "DOLZORE_WALK_MISSING:$rel"
            }
            Write-Host "DOLZORE_WALK_OK=$rel"
          }

          $receipt = Get-Content (Join-Path $env:WALK_PROJECT "BuildArtifacts\walk-demo-receipt.json") -Raw | ConvertFrom-Json
          if ($receipt.engine -ne "Unity") { throw "DOLZORE_NOT_UNITY" }
          if ($receipt.character_image_texture_used -ne $false) { throw "DOLZORE_IMAGE_CHARACTER_NOT_ALLOWED" }
          if ($receipt.acceptance -ne "PASS") { throw "DOLZORE_WALK_NOT_ACCEPTED" }

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: dolzore-unity-walkable-chibi
          retention-days: 14
          if-no-files-found: error
          path: |
            game/unity/WalkDemoProject/BuildArtifacts/walk-demo.png
            game/unity/WalkDemoProject/BuildArtifacts/walk-demo-receipt.json
            game/unity/WalkDemoProject/Builds/WalkDemo/**

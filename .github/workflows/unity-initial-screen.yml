name: DOLZORE Unity Initial Screen

on:
  push:
    branches: ["rebuild/unity-first-town-20260929"]
    paths:
      - "game/unity/bootstrap/**"
      - ".github/workflows/unity-initial-screen.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolzore-unity-initial-screen
  cancel-in-progress: true

jobs:
  build:
    runs-on: [dolzore-site-osk222]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Resolve validated Unity editor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (([string]$env:COMPUTERNAME).ToUpperInvariant() -ne 'OSK222') {
            throw "DOLZORE_WRONG_HOST:$env:COMPUTERNAME"
          }
          $unity = "C:\Program Files\Unity\Hub\Editor\6000.5.1f1\Editor\Unity.exe"
          if (-not (Test-Path $unity)) {
            throw "DOLZORE_UNITY_6000_5_1_NOT_FOUND"
          }
          $webgl = Join-Path (Split-Path $unity -Parent) "Data\PlaybackEngines\WebGLSupport"
          if (-not (Test-Path $webgl)) {
            throw "DOLZORE_WEBGL_MODULE_NOT_FOUND"
          }
          "UNITY_EXE=$unity" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "UNITY_EXE=$unity"

      - name: Materialize canonical Unity project settings
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $settings = Join-Path $project "ProjectSettings\ProjectSettings.asset"
          if (-not (Test-Path $settings)) {
            $template = Join-Path $env:RUNNER_TEMP "DolzoreUnityTemplate"
            if (Test-Path $template) { Remove-Item $template -Recurse -Force }
            $createLog = Join-Path $env:RUNNER_TEMP "dolzore-unity-create.log"
            $args = @("-quit","-batchmode","-createProject",$template,"-logFile",$createLog)
            $proc = Start-Process -FilePath "$env:UNITY_EXE" -ArgumentList $args -Wait -PassThru
            $code = $proc.ExitCode
            if (Test-Path $createLog) { Get-Content $createLog -Tail 180 }
            if ($code -ne 0) {
              throw "DOLZORE_UNITY_CREATE_FAILED:$code"
            }
            New-Item -ItemType Directory -Path $project -Force | Out-Null
            Copy-Item -Path (Join-Path $template "ProjectSettings") -Destination $project -Recurse -Force
            Copy-Item -Path (Join-Path $template "Packages") -Destination $project -Recurse -Force
          }

      - name: Sync authored Unity source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $source = Join-Path $env:GITHUB_WORKSPACE "game\unity\bootstrap"
          New-Item -ItemType Directory -Path (Join-Path $project "Assets") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $project "Packages") -Force | Out-Null
          Copy-Item -Path (Join-Path $source "Assets\*") -Destination (Join-Path $project "Assets") -Recurse -Force
          Copy-Item -Path (Join-Path $source "Packages\manifest.json") -Destination (Join-Path $project "Packages\manifest.json") -Force

      - name: Clear stale Unity lock for this workspace only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $normalized = [System.IO.Path]::GetFullPath($project)

          $unityProcesses = Get-CimInstance Win32_Process -Filter "Name='Unity.exe'" -ErrorAction SilentlyContinue
          foreach ($proc in $unityProcesses) {
            $cmd = [string]$proc.CommandLine
            if ($cmd -and $cmd.IndexOf($normalized, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              Write-Host "DOLZORE_STOP_STALE_UNITY_PID=$($proc.ProcessId)"
              Stop-Process -Id $proc.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }

          $lock = Join-Path $project "Temp\UnityLockfile"
          if (Test-Path $lock) {
            Remove-Item $lock -Force
            Write-Host "DOLZORE_STALE_UNITY_LOCK_REMOVED=true"
          }

      - name: Compile generate scenes and render preview
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $log = Join-Path $env:RUNNER_TEMP "dolzore-unity-generate.log"
          $args = @("-quit","-batchmode","-projectPath",$project,"-executeMethod","Dolzore.Editor.ProjectBootstrap.GenerateInitialSlice","-logFile",$log)
          $proc = Start-Process -FilePath "$env:UNITY_EXE" -ArgumentList $args -PassThru

          $deadline = (Get-Date).AddMinutes(6)
          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            $proc.Refresh()
          }

          if (-not $proc.HasExited) {
            Write-Host "DOLZORE_UNITY_GENERATE_TIMEOUT_PID=$($proc.Id)"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            if (Test-Path $log) { Get-Content $log -Tail 600 }
            throw "DOLZORE_UNITY_GENERATE_TIMEOUT_6M"
          }

          $code = $proc.ExitCode
          if (Test-Path $log) { Get-Content $log -Tail 600 }
          if ($code -ne 0) {
            throw "DOLZORE_UNITY_GENERATE_FAILED:$code"
          }

      - name: Verify scene and preview receipts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $required = @(
            "Assets\Scenes\Title.unity",
            "Assets\Scenes\FirstTownShell.unity",
            "Assets\Scenes\FirstTown3D.unity",
            "Assets\Art\Generated\title_background.png",
            "Assets\Art\Generated\dolzore_logo.png",
            "Assets\Art\Generated\first_town_minimap.png",
            "BuildArtifacts\initial-screen.png",
            "BuildArtifacts\first-town.png",
            "BuildArtifacts\first-town-3d.png",
            "BuildArtifacts\avatar-showcase.png",
            "BuildArtifacts\avatar-quality.json",
            "BuildArtifacts\first-town-acceptance.json"
          )
          foreach ($rel in $required) {
            $path = Join-Path $project $rel
            if (-not (Test-Path $path)) {
              throw "DOLZORE_MISSING_GENERATED_RECEIPT:$rel"
            }
            Write-Host "DOLZORE_OK=$rel"
          }
          $hash = (Get-FileHash (Join-Path $project "BuildArtifacts\initial-screen.png") -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "DOLZORE_INITIAL_SCREEN_SHA256=$hash"

      - name: Verify FF11-derived architecture contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          foreach ($rel in @(
            "Assets\Scripts\CoreRpgModels.cs",
            "Assets\Scripts\WorldIdentity.cs",
            "Assets\Scripts\FirstTownRuntime.cs",
            "Assets\Scripts\InternalRpgRulesData.cs",
            "Assets\Scripts\InternalCombatMath.cs",
            "Assets\Scripts\FfxiStatGradeRules.cs",
            "Assets\Scenes\FirstTownShell.unity"
          )) {
            $path = Join-Path $project $rel
            if (-not (Test-Path $path)) {
              throw "DOLZORE_ARCHITECTURE_FILE_MISSING:$rel"
            }
          }

          $scene = Get-Content (Join-Path $project "Assets\Scenes\FirstTownShell.unity") -Raw
          foreach ($token in @(
            "region.first_town.present",
            "entity.first_town.bar_13",
            "entity.first_town.journal",
            "private.first_town.player_home",
            "interior.first_town.bar_13",
            "vocation.warden"
          )) {
            if ($scene -notmatch [regex]::Escape($token)) {
              throw "DOLZORE_ARCHITECTURE_TOKEN_MISSING:$token"
            }
            Write-Host "DOLZORE_ARCHITECTURE_OK=$token"
          }

      - name: Build WebGL player
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $log = Join-Path $env:RUNNER_TEMP "dolzore-unity-webgl.log"
          $args = @("-quit","-batchmode","-projectPath",$project,"-buildTarget","WebGL","-executeMethod","Dolzore.Editor.ProjectBootstrap.BuildWebGLOnly","-logFile",$log)
          $proc = Start-Process -FilePath "$env:UNITY_EXE" -ArgumentList $args -Wait -PassThru
          $code = $proc.ExitCode
          if (Test-Path $log) { Get-Content $log -Tail 420 }
          if ($code -ne 0) {
            throw "DOLZORE_UNITY_WEBGL_FAILED:$code"
          }

      - name: Verify WebGL receipt
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $index = Join-Path $project "Builds\WebGL\index.html"
          if (-not (Test-Path $index)) {
            throw "DOLZORE_MISSING_WEBGL_INDEX"
          }
          Write-Host "DOLZORE_WEBGL_OK=$index"

      - name: Upload Unity visual and WebGL receipts
        uses: actions/upload-artifact@v4
        with:
          name: dolzore-unity-initial-screen
          if-no-files-found: error
          retention-days: 14
          path: |
            game/unity/Dolzore/BuildArtifacts/initial-screen.png
            game/unity/Dolzore/BuildArtifacts/first-town.png
            game/unity/Dolzore/BuildArtifacts/first-town-3d.png
            game/unity/Dolzore/BuildArtifacts/avatar-showcase.png
            game/unity/Dolzore/BuildArtifacts/avatar-quality.json
            game/unity/Dolzore/BuildArtifacts/first-town-acceptance.json
            game/unity/Dolzore/Builds/WebGL/**

      - name: Preserve generated Unity project source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "DOLZORE Unity Builder"
          git config user.email "actions@users.noreply.github.com"

          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $snapshot = Join-Path $env:RUNNER_TEMP "dolzore-generated-snapshot"
          if (Test-Path $snapshot) { Remove-Item $snapshot -Recurse -Force }
          New-Item -ItemType Directory -Path $snapshot -Force | Out-Null

          Copy-Item -Path (Join-Path $project "Assets") -Destination $snapshot -Recurse -Force
          Copy-Item -Path (Join-Path $project "Packages") -Destination $snapshot -Recurse -Force
          Copy-Item -Path (Join-Path $project "ProjectSettings") -Destination $snapshot -Recurse -Force

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "UNITY_SOURCE_PRESERVE_ATTEMPT=$attempt"

            git fetch origin rebuild/unity-first-town-20260929
            if ($LASTEXITCODE -ne 0) { throw "UNITY_SOURCE_FETCH_FAILED:$attempt" }

            git reset --hard origin/rebuild/unity-first-town-20260929
            if ($LASTEXITCODE -ne 0) { throw "UNITY_SOURCE_RESET_FAILED:$attempt" }

            foreach ($name in @("Assets","Packages","ProjectSettings")) {
              $target = Join-Path $project $name
              if (Test-Path $target) { Remove-Item $target -Recurse -Force }
              Copy-Item -Path (Join-Path $snapshot $name) -Destination $project -Recurse -Force
            }

            git add -A game/unity/Dolzore/Assets game/unity/Dolzore/Packages game/unity/Dolzore/ProjectSettings
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host "UNITY_PROJECT_SOURCE_ALREADY_CURRENT_AFTER_FETCH=true"
              exit 0
            }

            git commit -m "unity: generate initial screen project [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw "UNITY_SOURCE_COMMIT_FAILED:$attempt" }

            git push origin HEAD:rebuild/unity-first-town-20260929
            if ($LASTEXITCODE -eq 0) {
              Write-Host "UNITY_SOURCE_PRESERVE_SUCCESS=true"
              exit 0
            }

            Write-Host "UNITY_SOURCE_PUSH_RETRY=$attempt"
          }

          throw "UNITY_SOURCE_PRESERVE_RETRIES_EXHAUSTED"

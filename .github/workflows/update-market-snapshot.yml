name: Update SmartBuy market snapshot

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_market_snapshot.py"
      - ".github/workflows/update-market-snapshot.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolzore-market-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Run public market collector
        run: |
          python scripts/update_market_snapshot.py \
            --output docs/data/smartbuy-projectors.json

      - name: Validate public-site contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Commit changed snapshot
        shell: bash
        run: |
          if git diff --quiet -- docs/data/smartbuy-projectors.json; then
            echo "MARKET_SNAPSHOT_NO_CHANGE=true"
            exit 0
          fi
          git config user.name "dolzore-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/smartbuy-projectors.json
          git commit -m "Update SmartBuy market snapshot"
          git push

name: Update SmartBuy market snapshot

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_market_snapshot.py"
      - "tests/test_market_snapshot_contract.py"
      - ".github/workflows/update-market-snapshot.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/update_market_snapshot.py"
      - "tests/test_market_snapshot_contract.py"
      - ".github/workflows/update-market-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: dolzore-data-writers
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Market contract tests (do not test closed DOLZORE site)
        run: |
          python -m py_compile scripts/update_market_snapshot.py
          python -m unittest discover -s tests -p "test_market_snapshot_contract.py" -v

  update:
    needs: contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Run public market collector
        run: |
          python scripts/update_market_snapshot.py \
            --output docs/data/smartbuy-projectors.json

      - name: Verify fresh market snapshot contract
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("docs/data/smartbuy-projectors.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          generated = datetime.fromisoformat(payload["generatedAt"])
          if generated.tzinfo is None:
              raise SystemExit("SMARTBUY_SNAPSHOT_INVALID: generatedAt must be timezone-aware")
          age_seconds = (datetime.now(timezone.utc) - generated).total_seconds()
          if not -120 <= age_seconds <= 3600:
              raise SystemExit(f"SMARTBUY_SNAPSHOT_STALE: generatedAt age={age_seconds:.0f}s")
          if payload.get("schemaVersion") != 3 or not payload.get("trackedModels"):
              raise SystemExit("SMARTBUY_SNAPSHOT_INVALID: schema or trackedModels")
          for key in ("used", "observedUsed", "newItems", "modelSummaries"):
              if not isinstance(payload.get(key), list):
                  raise SystemExit(f"SMARTBUY_SNAPSHOT_INVALID: {key}")
          print(f"SMARTBUY_SNAPSHOT_FRESH=true age_seconds={age_seconds:.0f} "
                f"used={len(payload['used'])} observed={len(payload['observedUsed'])} "
                f"new={len(payload['newItems'])} models={len(payload['trackedModels'])}")
          PY

      - name: Validate public-site contracts
        run: python -m unittest discover -s tests -p "test_market_snapshot_contract.py" -v

      - name: Commit changed snapshot
        shell: bash
        run: |
          if git diff --quiet -- docs/data/smartbuy-projectors.json; then
            echo "MARKET_SNAPSHOT_NO_CHANGE=true"
            exit 0
          fi
          git config user.name "dolzore-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/smartbuy-projectors.json
          git commit -m "Update SmartBuy market snapshot"
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 3; continue; }
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1

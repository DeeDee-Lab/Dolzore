name: DOLZORE Game Engine QA\n\non:\n  push:\n    branches: ["rebuild/game-engine-20260929"]\n    paths:\n      - "game/**"\n      - "tests/game_engine_qa.py"\n      - ".github/workflows/game-engine-qa.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: dolzore-game-engine-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  build-and-test:\n    runs-on: ubuntu-latest\n    timeout-minutes: 25\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: "22"\n          cache: "npm"\n          cache-dependency-path: "game/package.json"\n      - name: Install game dependencies\n        working-directory: game\n        run: npm install --no-audit --no-fund\n      - name: TypeScript + Vite build\n        working-directory: game\n        run: npm run build\n      - name: Install Playwright\n        run: |\n          python -m pip install --disable-pip-version-check playwright\n          python -m playwright install --with-deps chromium\n      - name: Serve built docs\n        run: |\n          python -m http.server 8765 --directory docs --bind 127.0.0.1 > "$RUNNER_TEMP/dolzore-game-http.log" 2>&1 &\n          echo $! > "$RUNNER_TEMP/dolzore-game-http.pid"\n          sleep 2\n          curl -fsS http://127.0.0.1:8765/game/ >/dev/null\n      - name: Phaser first-town QA\n        run: python tests/game_engine_qa.py\n      - name: Stop server\n        if: always()\n        run: |\n          if [ -f "$RUNNER_TEMP/dolzore-game-http.pid" ]; then\n            kill "$(cat "$RUNNER_TEMP/dolzore-game-http.pid")" || true\n          fi
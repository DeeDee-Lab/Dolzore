name: FF11 Render Watch Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ff11-render-quantification-watch.yml'
      - '.github/workflows/ff11-render-quantification-watch-contract.yml'
      - 'tests/ff11_render_quantification_watch.test.mjs'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ff11_render_quantification_watch.test.mjs

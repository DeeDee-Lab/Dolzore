name: DOLZORE Public Site Closure Guard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dolzore-pages-closure
  cancel-in-progress: false

jobs:
  close-public-pages:
    runs-on: [dolzore-site-osk222]
    timeout-minutes: 10
    steps:
      - name: Enforce DOLZORE site runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
          if (([string]$env:COMPUTERNAME).ToUpperInvariant() -ne 'OSK222') {
            throw "DOLZORE_WRONG_HOST:$env:COMPUTERNAME"
          }

      - name: Capture current Pages state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $before = gh api repos/DeeDee-Lab/Dolzore/pages 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "DOLZORE_PAGES_BEFORE=$before"
          } else {
            Write-Host "DOLZORE_PAGES_BEFORE=ALREADY_DISABLED"
          }
          exit 0

      - name: Disable GitHub Pages
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          gh api --method DELETE repos/DeeDee-Lab/Dolzore/pages 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api repos/DeeDee-Lab/Dolzore/pages --silent 2>$null
            if ($LASTEXITCODE -eq 0) {
              throw "DOLZORE_PAGES_DELETE_FAILED"
            }
            Write-Host "DOLZORE_PAGES_ALREADY_DISABLED=true"
            exit 0
          }
          Write-Host "DOLZORE_PAGES_DELETE_REQUEST=SUCCESS"

      - name: Verify Pages is disabled
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          for ($i=0; $i -lt 12; $i++) {
            gh api repos/DeeDee-Lab/Dolzore/pages --silent 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "DOLZORE_PAGES_API_DISABLED=PASS"
              exit 0
            }
            Start-Sleep -Seconds 5
          }
          throw "DOLZORE_PAGES_STILL_ENABLED"

      - name: Verify legacy public URL is no longer serving the old site
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $url = "https://deedee-lab.github.io/Dolzore/"
          for ($i=0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing $url -MaximumRedirection 5 -ErrorAction Stop
              $body = [string]$r.Content
              Write-Host "LEGACY_URL_STATUS=$($r.StatusCode)"
              if ($r.StatusCode -ne 200 -or $body -notmatch 'DOLZORE') {
                Write-Host "LEGACY_PUBLIC_SITE_CLOSED=PASS"
                exit 0
              }
            } catch {
              Write-Host "LEGACY_PUBLIC_SITE_CLOSED=PASS"
              exit 0
            }
            Start-Sleep -Seconds 5
          }
          throw "LEGACY_PUBLIC_SITE_STILL_SERVING"

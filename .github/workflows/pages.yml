name: Publish DOLZORE GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dolzore-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [dolzore-site-osk222]
    timeout-minutes: 20
    steps:
      - name: Enforce DOLZORE site runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
          if (([string]$env:COMPUTERNAME).ToUpperInvariant() -ne 'OSK222') {
            throw "DOLZORE_WRONG_HOST:$env:COMPUTERNAME"
          }
      - uses: actions/checkout@v4
      - name: Validate public-site contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Configure Pages to publish main/docs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          gh api repos/DeeDee-Lab/Dolzore/pages --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST repos/DeeDee-Lab/Dolzore/pages -f "source[branch]=main" -f "source[path]=/docs"
            if ($LASTEXITCODE -ne 0) { throw "PAGES_CREATE_FAILED:$LASTEXITCODE" }
          }
          gh api --method PUT repos/DeeDee-Lab/Dolzore/pages -f build_type=legacy -f "source[branch]=main" -f "source[path]=/docs"
          if ($LASTEXITCODE -ne 0) { throw "PAGES_SOURCE_CONFIG_FAILED:$LASTEXITCODE" }
          Write-Host "PAGES_SOURCE=main:/docs"
      - name: Trigger Pages build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          gh api --method POST repos/DeeDee-Lab/Dolzore/pages/builds | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "PAGES_BUILD_TRIGGER_FAILED:$LASTEXITCODE" }
      - name: Wait for public Pages build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i=0; $i -lt 40; $i++) {
            $json = gh api repos/DeeDee-Lab/Dolzore/pages/builds/latest
            if ($LASTEXITCODE -ne 0) { throw "PAGES_BUILD_READ_FAILED:$LASTEXITCODE" }
            $build = $json | ConvertFrom-Json
            Write-Host "PAGES_BUILD_STATUS=$($build.status)"
            if ($build.status -eq 'built') {
              Write-Host "PAGES_URL=https://deedee-lab.github.io/Dolzore/"
              exit 0
            }
            if ($build.status -eq 'errored') {
              throw "PAGES_BUILD_ERRORED"
            }
            Start-Sleep -Seconds 5
          }
          throw "PAGES_BUILD_TIMEOUT"

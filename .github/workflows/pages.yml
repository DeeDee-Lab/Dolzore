name: Publish DOLZORE GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dolzore-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [dolzore-site-osk222]
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enforce DOLZORE site runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
          if (([string]$env:COMPUTERNAME).ToUpperInvariant() -ne 'OSK222') {
            throw "DOLZORE_WRONG_HOST:$env:COMPUTERNAME"
          }
      - uses: actions/checkout@v4
      - name: Validate public-site contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

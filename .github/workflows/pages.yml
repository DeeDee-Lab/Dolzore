name: Publish DOLZORE GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dolzore-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [dolzore-site-osk222]
    timeout-minutes: 20
    steps:
      - name: Enforce DOLZORE site runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
          if (([string]$env:COMPUTERNAME).ToUpperInvariant() -ne 'OSK222') {
            throw "DOLZORE_WRONG_HOST:$env:COMPUTERNAME"
          }
      - uses: actions/checkout@v4
      - name: Validate public-site contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Configure Pages to publish main/docs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          gh api repos/DeeDee-Lab/Dolzore/pages --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST repos/DeeDee-Lab/Dolzore/pages -f "source[branch]=main" -f "source[path]=/docs"
            if ($LASTEXITCODE -ne 0) { throw "PAGES_CREATE_FAILED:$LASTEXITCODE" }
          }
          gh api --method PUT repos/DeeDee-Lab/Dolzore/pages -f build_type=legacy -f "source[branch]=main" -f "source[path]=/docs"
          if ($LASTEXITCODE -ne 0) { throw "PAGES_SOURCE_CONFIG_FAILED:$LASTEXITCODE" }
          Write-Host "PAGES_SOURCE=main:/docs"
      - name: Verify Pages configuration and public URL
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pages = gh api repos/DeeDee-Lab/Dolzore/pages | ConvertFrom-Json
          Write-Host "PAGES_URL=$($pages.html_url)"
          Write-Host "PAGES_BUILD_TYPE=$($pages.build_type)"
          Write-Host "PAGES_SOURCE=$($pages.source.branch):$($pages.source.path)"
          if ($pages.source.branch -ne 'main' -or $pages.source.path -ne '/docs') {
            throw "PAGES_SOURCE_MISMATCH"
          }
          for ($i=0; $i -lt 24; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing "https://deedee-lab.github.io/Dolzore/"
              if ($r.StatusCode -eq 200 -and $r.Content -match '音を探す旅') {
                Write-Host "PUBLIC_READBACK=PASS"
                exit 0
              }
            } catch {
              Write-Host "PUBLIC_READBACK_WAIT=$i"
            }
            Start-Sleep -Seconds 5
          }
          throw "PUBLIC_READBACK_TIMEOUT"

name: DOLZORE First Town QA

on:
  push:
    branches: ["redesign/first-town-20260929"]
    paths:
      - "docs/**"
      - "tests/**"
      - ".github/workflows/first-town-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dolzore-first-town-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Start local site
        run: |
          python -m http.server 8765 --directory docs --bind 127.0.0.1 > "$RUNNER_TEMP/dolzore-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dolzore-http.pid"
          sleep 2
          curl -fsS http://127.0.0.1:8765/ >/dev/null
      - name: First town focused QA
        run: python tests/first_town_qa.py
      - name: Screenshot fingerprints
        if: always()
        run: |
          if [ -d qa-first-town ]; then
            sha256sum qa-first-town/* || true
          fi
      - name: Stop local site
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dolzore-http.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/dolzore-http.pid")" || true
          fi
name: DOLZORE FirstTown 2.5D Prototype

on:
  push:
    branches: ["prototype/first-town-25d-20261001"]
    paths:
      - "game/unity/bootstrap/**"
      - ".github/workflows/first-town-25d-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dolzore-first-town-25d-prototype
  cancel-in-progress: true

jobs:
  build:
    runs-on: [dolzore-site-osk222]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Resolve Unity editor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (([string]$env:COMPUTERNAME).ToUpperInvariant() -ne 'OSK222') {
            throw "DOLZORE_25D_WRONG_HOST:$env:COMPUTERNAME"
          }
          $unity = "C:\Program Files\Unity\Hub\Editor\6000.5.1f1\Editor\Unity.exe"
          if (-not (Test-Path $unity)) { throw "DOLZORE_UNITY_6000_5_1_NOT_FOUND" }
          $webgl = Join-Path (Split-Path $unity -Parent) "Data\PlaybackEngines\WebGLSupport"
          if (-not (Test-Path $webgl)) { throw "DOLZORE_WEBGL_MODULE_NOT_FOUND" }
          "UNITY_EXE=$unity" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sync prototype source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $source = Join-Path $env:GITHUB_WORKSPACE "game\unity\bootstrap"
          New-Item -ItemType Directory -Path (Join-Path $project "Assets") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $project "Packages") -Force | Out-Null
          Copy-Item -Path (Join-Path $source "Assets\*") -Destination (Join-Path $project "Assets") -Recurse -Force
          Copy-Item -Path (Join-Path $source "Packages\manifest.json") -Destination (Join-Path $project "Packages\manifest.json") -Force

      - name: Clear workspace Unity lock
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $normalized = [System.IO.Path]::GetFullPath($project)
          Get-CimInstance Win32_Process -Filter "Name='Unity.exe'" -ErrorAction SilentlyContinue | ForEach-Object {
            $cmd = [string]$_.CommandLine
            if ($cmd -and $cmd.IndexOf($normalized, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }
          $lock = Join-Path $project "Temp\UnityLockfile"
          if (Test-Path $lock) { Remove-Item $lock -Force }

      - name: Generate 2.5D comparison slice
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $log = Join-Path $env:RUNNER_TEMP "dolzore-25d-generate.log"
          $args = @("-quit","-batchmode","-projectPath",$project,"-executeMethod","Dolzore.Editor.FirstTown25DPrototype.Generate","-logFile",$log)
          $proc = Start-Process -FilePath "$env:UNITY_EXE" -ArgumentList $args -Wait -PassThru
          $code = $proc.ExitCode
          if (Test-Path $log) { Get-Content $log -Tail 500 }
          if ($code -ne 0) { throw "DOLZORE_25D_GENERATE_FAILED:$code" }

      - name: Verify 2.5D receipts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          foreach ($rel in @(
            "Assets\Scenes\FirstTown25DPrototype.unity",
            "BuildArtifacts\first-town-25d.png",
            "BuildArtifacts\first-town-25d-receipt.json"
          )) {
            $p = Join-Path $project $rel
            if (-not (Test-Path $p)) { throw "DOLZORE_25D_MISSING:$rel" }
            Write-Host "DOLZORE_25D_OK=$rel"
          }
          Get-Content (Join-Path $project "BuildArtifacts\first-town-25d-receipt.json")
          $hash = (Get-FileHash (Join-Path $project "BuildArtifacts\first-town-25d.png") -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "DOLZORE_25D_SCREENSHOT_SHA256=$hash"

      - name: Build 2.5D WebGL
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $project = Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $log = Join-Path $env:RUNNER_TEMP "dolzore-25d-webgl.log"
          $args = @("-quit","-batchmode","-projectPath",$project,"-buildTarget","WebGL","-executeMethod","Dolzore.Editor.FirstTown25DPrototype.BuildWebGL","-logFile",$log)
          $proc = Start-Process -FilePath "$env:UNITY_EXE" -ArgumentList $args -Wait -PassThru
          $code = $proc.ExitCode
          if (Test-Path $log) { Get-Content $log -Tail 500 }
          if ($code -ne 0) { throw "DOLZORE_25D_WEBGL_FAILED:$code" }
          $index = Join-Path $project "Builds\WebGL25D\index.html"
          if (-not (Test-Path $index)) { throw "DOLZORE_25D_WEBGL_INDEX_MISSING" }

      - name: Upload prototype receipts
        uses: actions/upload-artifact@v4
        with:
          name: dolzore-first-town-25d-prototype
          if-no-files-found: error
          retention-days: 14
          path: |
            game/unity/Dolzore/BuildArtifacts/first-town-25d.png
            game/unity/Dolzore/BuildArtifacts/first-town-25d-receipt.json
            game/unity/Dolzore/Assets/Scenes/FirstTown25DPrototype.unity
            game/unity/Dolzore/Builds/WebGL25D/**

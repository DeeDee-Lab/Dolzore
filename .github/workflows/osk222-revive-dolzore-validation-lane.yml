name: Revive Dolzore validation lane on OSK222

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/osk222-revive-dolzore-validation-lane.yml'

permissions:
  contents: read

jobs:
  revive:
    runs-on: [dolzore-site-osk222]
    timeout-minutes: 5
    steps:
      - name: Revive Automation validation runner and persist reboot recovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (([string]$env:COMPUTERNAME).ToUpperInvariant() -ne 'OSK222') {
            throw "WRONG_HOST:$env:COMPUTERNAME"
          }

          $automationRoot = Join-Path $env:LOCALAPPDATA 'DOLZORE\AutomationRunnerV3'
          $automationCmd = Join-Path $automationRoot 'run.cmd'
          $siteRoot = Join-Path $env:LOCALAPPDATA 'GitHubActionsRunner\DolzoreSite'
          $siteCmd = Join-Path $siteRoot 'run.cmd'

          if (-not (Test-Path -LiteralPath $automationCmd -PathType Leaf)) {
            throw "DOLZORE_AUTOMATION_RUNNER_CMD_MISSING:$automationCmd"
          }
          if (-not (Test-Path -LiteralPath $siteCmd -PathType Leaf)) {
            throw "DOLZORE_SITE_RUNNER_CMD_MISSING:$siteCmd"
          }

          $regPath = 'Software\Microsoft\Windows\CurrentVersion\Run'
          $cu = [Microsoft.Win32.Registry]::CurrentUser
          $runKey = $cu.OpenSubKey($regPath, $true)
          if ($null -eq $runKey) {
            $runKey = $cu.CreateSubKey($regPath, $true)
          }
          $automationRunValue = 'cmd.exe /c ""' + $automationCmd + '""'
          $siteRunValue = 'cmd.exe /c ""' + $siteCmd + '""'
          try {
            $runKey.SetValue('DOLZORE-AutomationRunnerV3', $automationRunValue, [Microsoft.Win32.RegistryValueKind]::String)
            $runKey.SetValue('DOLZORE-SiteRunner', $siteRunValue, [Microsoft.Win32.RegistryValueKind]::String)
          }
          finally {
            $runKey.Dispose()
          }
          Write-Host 'DOLZORE_RUNNER_HKCU_AUTOSTART_INSTALLED=true'
          Write-Host 'DOLZORE_RUN_KEY_PRESERVED=true'
          Write-Host 'DOLZORE_RUNNER_GUARDIAN_IS_PRIMARY_RECOVERY=true'

          $existing = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -eq 'Runner.Listener.exe' -and
            $_.ExecutablePath -and
            $_.ExecutablePath.StartsWith($automationRoot, [System.StringComparison]::OrdinalIgnoreCase)
          })

          if ($existing.Count -eq 0) {
            Remove-Item Env:RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
            Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', ('"' + $automationCmd + '"') -WorkingDirectory $automationRoot -WindowStyle Hidden
            Write-Host 'DOLZORE_AUTOMATION_RUNNER_START_REQUESTED=true'
            Start-Sleep -Seconds 8
          } else {
            Write-Host 'DOLZORE_AUTOMATION_RUNNER_ALREADY_RUNNING=true'
          }

          $after = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -eq 'Runner.Listener.exe' -and
            $_.ExecutablePath -and
            $_.ExecutablePath.StartsWith($automationRoot, [System.StringComparison]::OrdinalIgnoreCase)
          })
          Write-Host ('DOLZORE_AUTOMATION_RUNNER_PROCESS_COUNT=' + $after.Count)
          if ($after.Count -eq 0) {
            throw 'DOLZORE_AUTOMATION_RUNNER_NOT_RUNNING'
          }

          $opend = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -in @('OpenD.exe','FutuOpenD.exe')
          })
          Write-Host ('DOLZORE_OPEND_PROCESS_COUNT=' + $opend.Count)

          $listeners = @(Get-NetTCPConnection -State Listen -LocalPort 11111 -ErrorAction SilentlyContinue)
          Write-Host ('DOLZORE_OPEND_11111_LISTENER_COUNT=' + $listeners.Count)
          if ($listeners.Count -gt 0) {
            Write-Host 'DOLZORE_OPEND_LISTENER_READY=true'
          } else {
            Write-Host 'DOLZORE_OPEND_LISTENER_READY=false'
          }

          Write-Host 'DOLZORE_REVIVE_LANE_COMPLETE=true'

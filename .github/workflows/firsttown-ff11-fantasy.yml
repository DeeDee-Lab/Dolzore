name: DOLZORE FirstTown FF11 Fantasy 3D

on:
  push:
    branches: ["publish/firsttown-3d-20261003"]
    paths:
      - "game/unity/bootstrap/**"
      - ".github/workflows/firsttown-ff11-fantasy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolzore-firsttown-public-freeze
  cancel-in-progress: true

jobs:
  build:
    runs-on: [dolzore-site-osk222]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Resolve Unity editor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if (([string]$env:COMPUTERNAME).ToUpperInvariant() -ne 'OSK222') { throw "DOLZORE_WRONG_HOST:$env:COMPUTERNAME" }
          $unity="C:\Program Files\Unity\Hub\Editor\6000.5.1f1\Editor\Unity.exe"
          if (-not (Test-Path $unity)) { throw "DOLZORE_UNITY_6000_5_1_NOT_FOUND" }
          $webgl=Join-Path (Split-Path $unity -Parent) "Data\PlaybackEngines\WebGLSupport"
          if (-not (Test-Path $webgl)) { throw "DOLZORE_WEBGL_MODULE_NOT_FOUND" }
          "UNITY_EXE=$unity" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Materialize Unity project settings
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $settings=Join-Path $project "ProjectSettings\ProjectSettings.asset"
          if (-not (Test-Path $settings)) {
            $template=Join-Path $env:RUNNER_TEMP "DolzoreUnityTemplateFantasy"
            if(Test-Path $template){Remove-Item $template -Recurse -Force}
            $log=Join-Path $env:RUNNER_TEMP "dolzore-create.log"
            $p=Start-Process -FilePath "$env:UNITY_EXE" -ArgumentList @("-quit","-batchmode","-createProject",$template,"-logFile",$log) -Wait -PassThru
            if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 300};throw "UNITY_CREATE_FAILED:$($p.ExitCode)"}
            New-Item -ItemType Directory -Path $project -Force | Out-Null
            Copy-Item (Join-Path $template "ProjectSettings") $project -Recurse -Force
            Copy-Item (Join-Path $template "Packages") $project -Recurse -Force
          }

      - name: Sync authored Unity source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $source=Join-Path $env:GITHUB_WORKSPACE "game\unity\bootstrap"
          New-Item -ItemType Directory -Path (Join-Path $project "Assets") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $project "Packages") -Force | Out-Null
          Copy-Item (Join-Path $source "Assets\*") (Join-Path $project "Assets") -Recurse -Force
          Copy-Item (Join-Path $source "Packages\manifest.json") (Join-Path $project "Packages\manifest.json") -Force

      - name: Fetch CC0 fantasy production kit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $assets=Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore\Assets\External"
          $town=Join-Path $assets "FantasyTown"
          $castle=Join-Path $assets "Castle"
          $chars=Join-Path $assets "Characters"
          $kay=Join-Path $assets "KayTown"
          $adv=Join-Path $assets "Adventurers"
          $qchars=Join-Path $assets "QuaterniusRPG"
          $quat=Join-Path $assets "QuaterniusVillage"
          $kayProps=Join-Path $kay "Props"
          $kayNature=Join-Path $kay "Nature"
          New-Item -ItemType Directory -Path $town,$castle,$kay,$kayProps,$kayNature,$adv,$qchars,$quat,(Join-Path $qchars "Models"),(Join-Path $qchars "Textures"),(Join-Path $adv "Characters"),(Join-Path $adv "Animations"),(Join-Path $town "Textures"),(Join-Path $castle "Textures"),(Join-Path $chars "Model"),(Join-Path $chars "Skins") -Force | Out-Null

          function Fetch([string]$url,[string]$dest) {
            Write-Host "FETCH=$url"
            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $dest
            if((Get-Item $dest).Length -lt 256){ throw "DOLZORE_ASSET_TOO_SMALL:$dest" }
          }

          $base="https://media.githubusercontent.com/media/series-ai/jam-ready-assets/main"
          $townFiles=@(
            "wall-wood-window-shutters","wall-window-shutters","wall-wood-door","wall-door",
            "wall-wood-window-stone","wall-window-stone","wall-wood-window-small","wall-window-small",
            "wall-wood","wall","roof-high","roof-gable","balcony-wall-fence","overhang",
            "banner-red","banner-green","chimney","fountain-round","fountain-round-detail","fountain-center",
            "stall-bench","stall-red","stall-green","stall-stool","cart","cart-high","wall-arch","wall-arch-top-detail",
            "tree-high","tree-high-round","tree-crooked","lantern","hedge","hedge-large","fence","fence-gate",
            "pillar-stone","rock-small","rock-wide","stairs-wide-stone-handrail"
          )
          foreach($name in $townFiles){
            $url="$base/kenney-fantasy-town-kit/3D/fantasy/Models/FBX%20format/$name.fbx"
            Fetch $url (Join-Path $town "$name.fbx")
          }
          Fetch "$base/kenney-fantasy-town-kit/3D/fantasy/Models/Textures/variation-a.png" (Join-Path $town "Textures\variation-a.png")

          $castleFiles=@("tower-square","gate","flag-banner-long")
          foreach($name in $castleFiles){
            $url="$base/kenney-castle-kit/3D/fantasy/Models/FBX%20format/$name.fbx"
            Fetch $url (Join-Path $castle "$name.fbx")
          }
          foreach($v in @("a","b","c","d","e","f","g")){
            Fetch "$base/kenney-castle-kit/3D/fantasy/Models/Textures/variation-$v.png" (Join-Path $castle "Textures\variation-$v.png")
          }

          Fetch "$base/kenney-animated-characters-protagonists/3D/characters/Model/characterMedium.fbx" (Join-Path $chars "Model\characterMedium.fbx")
          foreach($skin in @("skaterFemaleA.png","skaterMaleA.png","criminalMaleA.png","cyborgFemaleA.png")){
            Fetch "$base/kenney-animated-characters-protagonists/3D/characters/Skins/$skin" (Join-Path $chars "Skins\$skin")
          }

          $kayBase="$base/kaykit-medieval-hexagon/3D/strategy-hex/Assets/fbx(unity)/buildings/blue"
          $kayFiles=@(
            "building_tavern_blue","building_home_A_blue","building_home_B_blue","building_market_blue",
            "building_townhall_blue","building_blacksmith_blue","building_workshop_blue",
            "building_church_blue","building_barracks_blue","building_castle_blue",
            "building_watchtower_blue","building_well_blue"
          )
          foreach($name in $kayFiles){
            Fetch "$kayBase/$name.fbx" (Join-Path $kay "$name.fbx")
          }
          Fetch "$kayBase/hexagons_medieval.png" (Join-Path $kay "hexagons_medieval.png")

          $propBase="$base/kaykit-medieval-hexagon/3D/strategy-hex/Assets/fbx(unity)/decoration/props"
          foreach($name in @("barrel","crate_A_big","crate_A_small","crate_B_small","sack","wheelbarrow","weaponrack","haybale","flag_blue","flag_red")){
            Fetch "$propBase/$name.fbx" (Join-Path $kayProps "$name.fbx")
          }
          $natureBase="$base/kaykit-medieval-hexagon/3D/strategy-hex/Assets/fbx(unity)/decoration/nature"
          foreach($name in @("tree_single_A","tree_single_B","trees_A_medium","trees_B_medium","hill_single_A","hill_single_B","mountain_A_grass_trees","mountain_B_grass_trees")){
            Fetch "$natureBase/$name.fbx" (Join-Path $kayNature "$name.fbx")
          }

          $advBase="$base/kaykit-adventurers/3D/characters"
          foreach($name in @("Knight","Mage","Ranger","Rogue","Druid","Engineer")){
            Fetch "$advBase/Characters/fbx/$name.fbx" (Join-Path $adv "Characters\$name.fbx")
          }
          foreach($name in @("knight_texture.png","mage_texture.png","ranger_texture.png","rogue_texture.png","druid_texture.png","engineer_texture.png")){
            Fetch "$advBase/Characters/fbx/$name" (Join-Path $adv "Characters\$name")
          }
          Fetch "$advBase/Animations/fbx/Rig_Medium/Rig_Medium_General.fbx" (Join-Path $adv "Animations\Rig_Medium_General.fbx")
          Fetch "$advBase/Animations/fbx/Rig_Medium/Rig_Medium_MovementBasic.fbx" (Join-Path $adv "Animations\Rig_Medium_MovementBasic.fbx")

          # Quaternius RPG Character Pack — CC0. Use a pinned public mirror with original files.
          $qCharBase="https://raw.githubusercontent.com/mertgurgenyatagi/TurkeyWars/main/turkey-wars/assets/character_pack/RPG%20Characters%20-%20Nov%202020"
          Fetch "$qCharBase/License.txt" (Join-Path $qchars "License.txt")
          foreach($name in @("Warrior","Ranger","Rogue","Wizard","Cleric","Monk")){
            Fetch "$qCharBase/FBX/$name.fbx" (Join-Path $qchars "Models\$name.fbx")
            Fetch "$qCharBase/Textures/$($name)_Texture.png" (Join-Path $qchars "Textures\$($name)_Texture.png")
          }
          foreach($weapon in @("Warrior_Sword_Texture","Ranger_Bow_Texture","Rogue_Dagger_Texture","Wizard_Staff_Texture","Cleric_Staff_Texture")){
            Fetch "$qCharBase/Textures/$weapon.png" (Join-Path $qchars "Textures\$weapon.png")
          }

          # Quaternius Medieval Village Pack — CC0 — original OBJ/MTL preserved from pinned mirror.
          $qBase="https://raw.githubusercontent.com/mr-highball/Phanes/main/assets/library/kits/quaternius-lowpoly-medieval-village-pack-surface-v1"
          Fetch "$qBase/License.txt" (Join-Path $quat "License.txt")
          $qOriginal="$qBase/Original"
          $qFiles=@(
            @("Bell_Tower","197140ba8ee3d0f69a4f968b985be4a273a7033dccc5ec596625eb6f124ce64c","7dd5a911b02c98e044197742d85624dfeedee144bfbbc233a7ddd454f361d131"),
            @("Blacksmith","49b3ca2b02664239d6810b8816081db53b7d779558b94b12d2bf9a6421faa68a","eee6042ef6e520ab7a4af10a11478a848c4aa6de637d7e5a73035d5c22625ffe"),
            @("House_1","3b9287272ad4bb51a269d3e39720ddccbf634cd223d29f5c0ac0356834b1a22e","c3241e56d572963003ebac7efa40c89e39d6e50d9d6de7274038904ba5316f8b"),
            @("House_2","9da9edd6887d76414e87d1d216406684da47d9d048f2d186780760098ea4eb28","b612714067fe27759cb7188ddcb2c9b7610c678910c2e0fdfd1e9b4ef19f7b58"),
            @("House_3","926020ac0da1407fba73f7924a5190bf642b59d64f5a168adc22579dea57e1f3","a64016896711c6772cab56ba8b381d4ced0634615d9c363654fb212b7b98d0ed"),
            @("House_4","ebfa070e6b4947a3b54b5da2eff1682120d0f310bd23dfbf47dbfc332c4f0c64","e9497dc78c38598aa3fc46d6c15d491bcfba316b069450bcb342d6407241400f"),
            @("Sawmill","2b7a27612e6be65bbfeb9dee12d9c9af8d99e03fd854fb2ac51c13ac7427f2e8","822edbe46316c55c9e0d6a696d90181be81aa5b47a4631c2ec967bf9902358ef"),
            @("Stable","d86ef7ffa56b490bdfe1790cfe94cd82b6312dbe95c571a4028d4032cd8e4d1d","e88b5467dc08f2fa53479c04a198e651f0b6848839dc1cbe0b24355022a76e02")
          )
          foreach($q in $qFiles){
            Fetch "$qOriginal/$($q[1]).obj" (Join-Path $quat "$($q[0]).obj")
            Fetch "$qOriginal/$($q[2]).mtl" (Join-Path $quat "$($q[0]).mtl")
          }

          $fbxCount=(Get-ChildItem $town -Filter *.fbx).Count + (Get-ChildItem $castle -Filter *.fbx).Count + (Get-ChildItem $kay -Filter *.fbx -Recurse).Count + (Get-ChildItem (Join-Path $adv "Characters") -Filter *.fbx).Count
          $skinCount=(Get-ChildItem (Join-Path $chars "Skins") -Filter *.png).Count
          Write-Host "DOLZORE_EXTERNAL_FBX_COUNT=$fbxCount"
          Write-Host "DOLZORE_CHARACTER_SKINS=$skinCount"
          $objCount=(Get-ChildItem $quat -Filter *.obj).Count
          $qcharCount=(Get-ChildItem (Join-Path $qchars "Models") -Filter *.fbx).Count
          Write-Host "DOLZORE_QUATERNIUS_OBJ_COUNT=$objCount"
          Write-Host "DOLZORE_QUATERNIUS_RPG_CHAR_COUNT=$qcharCount"
          if($fbxCount -lt 30){throw "DOLZORE_FANTASY_ASSET_SET_INCOMPLETE:$fbxCount"}
          if($objCount -lt 8){throw "DOLZORE_QUATERNIUS_SET_INCOMPLETE:$objCount"}
          if($qcharCount -lt 6){throw "DOLZORE_QUATERNIUS_RPG_SET_INCOMPLETE:$qcharCount"}

      - name: Clear stale Unity lock
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $normalized=[System.IO.Path]::GetFullPath($project)
          Get-CimInstance Win32_Process -Filter "Name='Unity.exe'" -ErrorAction SilentlyContinue | ForEach-Object {
            $cmd=[string]$_.CommandLine
            if($cmd -and $cmd.IndexOf($normalized,[System.StringComparison]::OrdinalIgnoreCase) -ge 0){Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue}
          }
          $lock=Join-Path $project "Temp\UnityLockfile"
          if(Test-Path $lock){Remove-Item $lock -Force}

      - name: Generate dense fantasy FirstTown
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $log=Join-Path $env:RUNNER_TEMP "dolzore-firsttown-fantasy-generate.log"
          $args=@("-quit","-batchmode","-projectPath",$project,"-executeMethod","Dolzore.Editor.ProjectBootstrap.GenerateInitialSlice","-logFile",$log)
          $p=Start-Process -FilePath "$env:UNITY_EXE" -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(10)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep -Seconds 2;$p.Refresh()}
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;if(Test-Path $log){Get-Content $log -Tail 1200};throw "DOLZORE_FANTASY_GENERATE_TIMEOUT"}
          if(Test-Path $log){Get-Content $log -Tail 1200}
          if($p.ExitCode -ne 0){throw "DOLZORE_FANTASY_GENERATE_FAILED:$($p.ExitCode)"}

      - name: Verify real 3D preview
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          foreach($rel in @("Assets\Scenes\FirstTown3D.unity","BuildArtifacts\first-town-3d.png")){
            $p=Join-Path $project $rel
            if(-not (Test-Path $p)){throw "DOLZORE_FANTASY_MISSING:$rel"}
            Write-Host "DOLZORE_FANTASY_OK=$rel"
          }
          $img=Join-Path $project "BuildArtifacts\first-town-3d.png"
          $hash=(Get-FileHash $img -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "DOLZORE_FIRSTTOWN_FANTASY_SCREENSHOT_SHA256=$hash"
          $license=Join-Path $project "BuildArtifacts\FIRSTTOWN_EXTERNAL_ASSET_LICENSES.txt"
          @(
            "Kenney Fantasy Town Kit — CC0 1.0 — https://kenney.nl/assets/fantasy-town-kit",
            "Kenney Castle Kit — CC0 1.0 — https://kenney.nl/assets/castle-kit",
            "Kenney Animated Characters: Protagonists — CC0 1.0 — https://kenney.nl/"
          ) | Set-Content $license -Encoding utf8

      - name: Upload visual proof before WebGL
        uses: actions/upload-artifact@v4
        with:
          name: dolzore-firsttown-ff11-fantasy-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            game/unity/Dolzore/BuildArtifacts/first-town-3d.png
            game/unity/Dolzore/Assets/Scenes/FirstTown3D.unity
            game/unity/Dolzore/BuildArtifacts/FIRSTTOWN_EXTERNAL_ASSET_LICENSES.txt

      - name: Build WebGL
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore"
          $log=Join-Path $env:RUNNER_TEMP "dolzore-firsttown-fantasy-webgl.log"
          $args=@("-quit","-batchmode","-projectPath",$project,"-buildTarget","WebGL","-executeMethod","Dolzore.Editor.ProjectBootstrap.BuildWebGLOnly","-logFile",$log)
          $p=Start-Process -FilePath "$env:UNITY_EXE" -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(18)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep -Seconds 3;$p.Refresh()}
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;if(Test-Path $log){Get-Content $log -Tail 1000};throw "DOLZORE_FANTASY_WEBGL_TIMEOUT"}
          if(Test-Path $log){Get-Content $log -Tail 1000}
          if($p.ExitCode -ne 0){throw "DOLZORE_FANTASY_WEBGL_FAILED:$($p.ExitCode)"}
          $index=Join-Path $project "Builds\WebGL\index.html"
          if(-not (Test-Path $index)){throw "DOLZORE_FANTASY_WEBGL_INDEX_MISSING"}

      - name: Materialize static HP payload
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE "game\unity\Dolzore\Builds\WebGL"
          $dst=Join-Path $env:GITHUB_WORKSPACE "docs\firsttown3d"
          if(Test-Path $dst){Remove-Item $dst -Recurse -Force}
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item (Join-Path $src "*") $dst -Recurse -Force
          if(-not (Test-Path (Join-Path $dst "index.html"))){throw "DOLZORE_PUBLIC_INDEX_MISSING"}
          $buildDir=Join-Path $dst "Build"
          if(-not (Test-Path $buildDir)){throw "DOLZORE_PUBLIC_BUILD_DIR_MISSING"}
          $buildFiles=Get-ChildItem -LiteralPath $buildDir -File
          if($buildFiles.Count -lt 3){throw "DOLZORE_PUBLIC_BUILD_FILES_INCOMPLETE:$($buildFiles.Count)"}
          Write-Host "DOLZORE_PUBLIC_BUILD_FILES=$($buildFiles.Count)"
          @'
          <!doctype html>
          <html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0; url=firsttown3d/"><title>DOLZORE FirstTown</title></head>
          <body><a href="firsttown3d/">DOLZORE FirstTownを開く</a></body></html>
          '@ | Set-Content (Join-Path $env:GITHUB_WORKSPACE "docs\firsttown.html") -Encoding utf8
          Write-Host "DOLZORE_PUBLIC_PAYLOAD=READY"

      - name: Persist frozen public candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name "DOLZORE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f docs/firsttown3d
          git add docs/firsttown.html
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){
            Write-Host "DOLZORE_PUBLIC_PAYLOAD_UNCHANGED=true"
          } else {
            git commit -m "publish: freeze FirstTown 3D WebGL candidate"
            git push origin HEAD:publish/firsttown-3d-20261003
          }

      - name: Upload complete FirstTown
        uses: actions/upload-artifact@v4
        with:
          name: dolzore-firsttown-ff11-fantasy
          if-no-files-found: error
          retention-days: 14
          path: |
            game/unity/Dolzore/BuildArtifacts/first-town-3d.png
            game/unity/Dolzore/Assets/Scenes/FirstTown3D.unity
            game/unity/Dolzore/BuildArtifacts/FIRSTTOWN_EXTERNAL_ASSET_LICENSES.txt
            game/unity/Dolzore/Builds/WebGL/**

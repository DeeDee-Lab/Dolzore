name: OSK222 Roblox Process Observer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/osk222-roblox-process-observer.yml"

permissions:
  contents: read

jobs:
  observe:
    runs-on: [dolzore-site-osk222]
    timeout-minutes: 3
    steps:
      - name: Observe Roblox process and install state
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          if ($env:COMPUTERNAME.ToUpperInvariant() -ne 'OSK222') { throw "WRONG_HOST:$env:COMPUTERNAME" }
          Write-Output "HOST=$env:COMPUTERNAME"
          Write-Output "USER=$(whoami)"
          Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.ProcessName -match 'Roblox|winget' } |
            Select-Object ProcessName,Id,StartTime |
            Format-Table -AutoSize
          foreach($root in @(
            (Join-Path $env:LOCALAPPDATA 'Roblox\Versions'),
            'C:\Program Files (x86)\Roblox\Versions',
            'C:\Program Files\Roblox\Versions'
          )){
            if(Test-Path -LiteralPath $root){
              Get-ChildItem -LiteralPath $root -Filter 'RobloxStudioBeta.exe' -File -Recurse -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 3 FullName,Length,LastWriteTime
            }
          }
          Write-Output 'READ_ONLY=true'
          Write-Output 'DC_RDC_USED=false'

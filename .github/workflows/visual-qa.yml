name: DOLZORE visual QA
# final integrated QA v2

on:
  push:
    branches: [main, "redesign/final-site-20260929"]
    paths:
      - "docs/**/*.html"
      - "docs/styles.css"
      - "docs/site.js"
      - "docs/town-game.js"
      - "docs/assets/**"
      - "tests/**"
      - ".github/workflows/visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dolzore-visual-qa
  cancel-in-progress: true

jobs:
  visual:
    runs-on: [dolzore-site-osk222]
    timeout-minutes: 25
    steps:
      - name: Enforce DOLZORE site runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (([string]$env:COMPUTERNAME).ToUpperInvariant() -ne 'OSK222') {
            throw "DOLZORE_WRONG_HOST:$env:COMPUTERNAME"
          }
      - uses: actions/checkout@v4
      - name: Contract and public-safety tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Install browser QA dependency
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Start local static server
        shell: powershell
        run: |
          $p = Start-Process python -ArgumentList "-m","http.server","8765","--directory","docs","--bind","127.0.0.1" -PassThru
          Set-Content -Path "$env:RUNNER_TEMP\dolzore-http.pid" -Value $p.Id
          Start-Sleep -Seconds 2
          Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8765/" | Out-Null
      - name: Desktop mobile and jukebox QA
        run: python tests/visual_qa.py
      - name: Record screenshot fingerprints
        shell: powershell
        run: |
          Get-ChildItem qa-screenshots | ForEach-Object {
            $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "SCREENSHOT $($_.Name) SHA256=$h BYTES=$($_.Length)"
          }
      - name: Emit compact visual previews to log
        shell: powershell
        run: |
          foreach ($name in @("desktop-home-preview.jpg","desktop-jukebox-preview.jpg","desktop-journal-preview.jpg","mobile-home-preview.jpg","mobile-music-preview.jpg","mobile-journal-preview.jpg")) {
            $path=Join-Path "qa-screenshots" $name
            $b64=[Convert]::ToBase64String([IO.File]::ReadAllBytes($path))
            Write-Host "DOLZORE_SCREENSHOT_B64_BEGIN:$name"
            Write-Host $b64
            Write-Host "DOLZORE_SCREENSHOT_B64_END:$name"
          }
      - name: Stop local static server
        if: always()
        shell: powershell
        run: |
          if (Test-Path "$env:RUNNER_TEMP\dolzore-http.pid") {
            $id = Get-Content "$env:RUNNER_TEMP\dolzore-http.pid"
            Stop-Process -Id $id -Force -ErrorAction SilentlyContinue
          }

name: Publish Unity Walk Demo Artifact

on:
  push:
    branches:
      - feature/unity-walkable-chibi
    paths:
      - .github/workflows/publish-unity-walk-demo.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download accepted Unity artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf artifact
          mkdir -p artifact
          gh run download 36953875618 \
            --repo DeeDee-Lab/Dolzore \
            --name dolzore-unity-walkable-chibi \
            --dir artifact

          test -f artifact/Builds/WalkDemo/index.html
          test -f artifact/BuildArtifacts/walk-demo-receipt.json

          python - <<'PY'
          from pathlib import Path
          p=Path("artifact/Builds/WalkDemo/index.html")
          s=p.read_text(encoding="utf-8")
          anchor='document.querySelector("#unity-fullscreen-button").onclick = () => {'
          if anchor not in s:
              raise SystemExit("DOLZORE_DPAD_ANCHOR_NOT_FOUND")
          if "dolzore-dpad" not in s:
              injection=r'''
                const pad = document.createElement('div');
                pad.id = 'dolzore-dpad';
                pad.innerHTML = '<button data-dir="up">▲</button><div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>';
                pad.style.cssText = 'position:fixed;right:22px;bottom:22px;z-index:9999;display:grid;gap:6px;justify-items:center;user-select:none;-webkit-user-select:none;';
                pad.querySelector('div').style.cssText = 'display:flex;gap:6px';
                document.body.appendChild(pad);
                pad.querySelectorAll('button').forEach((button) => {
                  button.style.cssText = 'width:58px;height:58px;border-radius:14px;border:2px solid rgba(255,255,255,.7);background:rgba(18,32,64,.88);color:white;font-size:25px;font-weight:700;touch-action:none;box-shadow:0 4px 18px rgba(0,0,0,.3)';
                  const dir = button.dataset.dir;
                  const press = (event) => {
                    event.preventDefault();
                    unityInstance.SendMessage('Lunaria Walkable Character', 'SetExternalInput', dir);
                  };
                  const release = (event) => {
                    event.preventDefault();
                    unityInstance.SendMessage('Lunaria Walkable Character', 'ClearExternalInput');
                  };
                  button.addEventListener('pointerdown', press);
                  button.addEventListener('pointerup', release);
                  button.addEventListener('pointercancel', release);
                  button.addEventListener('pointerleave', release);
                  button.addEventListener('click', (event) => {
                    event.preventDefault();
                    unityInstance.SendMessage('Lunaria Walkable Character', 'Nudge', dir);
                  });
                });

              '''
              s=s.replace(anchor, injection+anchor)
              p.write_text(s, encoding="utf-8")
          print("DOLZORE_DPAD_PATCH=PASS")
          PY

          python - <<'PY'
          import json
          p="artifact/BuildArtifacts/walk-demo-receipt.json"
          d=json.load(open(p, encoding="utf-8"))
          assert d["engine"] == "Unity"
          assert d["character_image_texture_used"] is False
          assert d["acceptance"] == "PASS"
          assert d["webgl"] is True
          print("UNITY_ARTIFACT_ACCEPTED")
          PY

      - name: Stage WebGL on publish branch
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/dolzore-walk-demo-publish"
          rm -rf "$worktree"

          git fetch origin main
          git worktree add -B publish/unity-walk-demo "$worktree" origin/main

          target="$worktree/docs/unity-walk-demo"
          rm -rf "$target"
          mkdir -p "$target"
          cp -a artifact/Builds/WalkDemo/. "$target/"

          mkdir -p "$target/_receipt"
          cp artifact/BuildArtifacts/walk-demo-receipt.json "$target/_receipt/"
          cp artifact/BuildArtifacts/walk-demo.png "$target/_receipt/"

          cd "$worktree"
          git config user.name "DOLZORE Unity Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add docs/unity-walk-demo

          if ! git diff --cached --quiet; then
            git commit -m "unity: publish walkable chibi WebGL demo"
          fi

          git push --force origin HEAD:publish/unity-walk-demo
          echo "PUBLISH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          echo "Unity WebGL staged on publish/unity-walk-demo"
          echo "PUBLISH_SHA=$PUBLISH_SHA"

name: Update DOLZORE product media

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_product_media.py"
      - "docs/data/product-media.json"
      - ".github/workflows/update-product-media.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolzore-data-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Resolve official product images
        run: python scripts/update_product_media.py --file docs/data/product-media.json
      - name: Validate public-site contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Commit changed media manifest
        shell: bash
        run: |
          if git diff --quiet -- docs/data/product-media.json; then
            echo "PRODUCT_MEDIA_NO_CHANGE=true"
            exit 0
          fi
          git config user.name "dolzore-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/product-media.json
          git commit -m "Update official product media"
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 3; continue; }
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1

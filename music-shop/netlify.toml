# Standalone Netlify site "dolzore-music-store".
# Netlify base directory: music-shop
# GitHub repository: DeeDee-Lab/Dolzore (existing; NO NEW PAGE SOURCE).
[build]
  command = "python3 build.py"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# User explicitly closed the former GitHub Pages / Unity town.
# Root redirect is implemented inside the exported index.html only.
